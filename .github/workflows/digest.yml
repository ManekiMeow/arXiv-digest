name: arXiv quant-ph digest

on:
  schedule:
    # GitHub cron is UTC only and does not follow DST, so both times are
    # registered and the guard step below lets exactly one through.
    # Deliberately off the top of the hour: GitHub queues scheduled runs
    # hardest at :00, and a run that is delayed far enough gets dropped.
    # The nominal 02:07 Berlin is also deliberately early: GitHub delivers
    # this repository's scheduled events 4.8-5.7h late (mean 5.3h over the
    # last ten runs), so 02:07 nominal actually lands around 07:20 Berlin.
    - cron: '07 0 * * 1-5'  # 00:07 UTC = 02:07 Europe/Berlin while CEST (summer)
    - cron: '07 1 * * 1-5'  # 01:07 UTC = 02:07 Europe/Berlin while CET  (winter)
    # Catch-up, live in both seasons. It only posts if today's digest has not
    # gone out yet (--once-per-day), i.e. when the main run failed or GitHub
    # never fired it. On 2026-11-02 and 2026-11-03 oaipmh.arxiv.org stopped
    # answering during the main run and, with nothing to retry later, both
    # days were lost; on 2026-10-31 GitHub fired neither DST cron at all.
    - cron: '37 3 * * 1-5'  # 03:37 UTC, ~2.5h after the winter main cron
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the payload instead of posting to Slack'
        type: boolean
        default: true

concurrency:
  group: arxiv-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # The harvest rides out ~20 minutes of arXiv not answering before failing;
    # this only stops a run that hangs past that.
    timeout-minutes: 40
    env:
      # Must stay identical to the three `cron:` entries above - the guard
      # compares against them verbatim.
      CRON_SUMMER: '07 0 * * 1-5'
      CRON_WINTER: '07 1 * * 1-5'
      CRON_CATCHUP: '37 3 * * 1-5'
    steps:
      # Picks whichever of the two DST crons is the live one. This keys off
      # *which cron entry fired* rather than the wall-clock hour on the runner:
      # GitHub delivers scheduled runs late whenever it is busy (on 2026-08-27
      # both entries arrived ~10h late, at 14:26 and 15:26 Berlin), and the old
      # `hour must equal 04` test then rejected both of them and dropped the
      # whole day while still reporting the job as successful.
      - name: Select the cron matching Berlin's current UTC offset
        id: guard
        env:
          FIRED_CRON: ${{ github.event.schedule }}
        run: |
          echo "Berlin local time: $(TZ=Europe/Berlin date --iso-8601=minutes)"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run - proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$FIRED_CRON" = "$CRON_CATCHUP" ]; then
            echo "Catch-up cron - the digest posts only if today's has not gone out yet."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OFFSET=$(TZ=Europe/Berlin date +%z)
          if [ "$OFFSET" = "+0200" ]; then
            WANTED="$CRON_SUMMER"
          else
            WANTED="$CRON_WINTER"
          fi
          echo "Berlin is at UTC$OFFSET, so the live cron is '$WANTED'."
          echo "This run was fired by cron '$FIRED_CRON'."

          if [ "$FIRED_CRON" = "$WANTED" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$FIRED_CRON" != "$CRON_SUMMER" ] && [ "$FIRED_CRON" != "$CRON_WINTER" ]; then
            # The schedule was edited without updating the CRON_* env vars.
            # Fail open: scheduled runs pass --once-per-day, so a redundant run
            # posts nothing, whereas failing closed would silently stop the
            # digest again.
            echo "::warning::'$FIRED_CRON' matches none of CRON_SUMMER, CRON_WINTER, CRON_CATCHUP - running anyway. Re-sync the env block with the cron entries."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Off-season DST cron - skipping."
            echo "Skipped: fired by off-season cron '$FIRED_CRON' (live cron is '$WANTED')." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - name: Install uv
        if: steps.guard.outputs.run == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: uv sync --locked

      # state.json carries last_run and recently-sent ids so a paper is never
      # posted twice. A fresh restore-key prefix picks up the newest cache.
      - name: Restore digest state
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: arxiv-digest-state-${{ github.run_id }}
          restore-keys: |
            arxiv-digest-state-

      - name: Run digest
        if: steps.guard.outputs.run == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            uv run digest.py --dry-run
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # At most one digest per Berlin day across the main and catch-up
            # crons. Manual runs skip this so they can always force a post.
            uv run digest.py --once-per-day
          else
            uv run digest.py
          fi

      - name: Save digest state
        if: steps.guard.outputs.run == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: arxiv-digest-state-${{ github.run_id }}
